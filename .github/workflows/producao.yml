# Sobe o banco e as funções do Supabase sempre que houver push na branch main.
# O site em si é publicado pelo Netlify, ligado direto ao repositório.
# Segredos necessários (GitHub › Settings › Secrets and variables › Actions):
#   SUPABASE_ACCESS_TOKEN  (supabase.com › Account › Access Tokens)
#   SUPABASE_PROJECT_REF   (Project Settings › General › Reference ID)
#   SUPABASE_DB_PASSWORD   (a senha do banco criada junto com o projeto)
name: Produção

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testar-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  supabase:
    needs: testar-site
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Ligar ao projeto
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Atualizar o banco
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Publicar as funções
        run: |
          supabase functions deploy assinatura-webhook --use-api --yes
          supabase functions deploy excluir-conta --use-api --yes
          supabase functions deploy lembretes --use-api --yes
          supabase functions deploy enviar-amostra --use-api --yes
          supabase functions deploy asaas-webhook --use-api --yes
          supabase functions deploy asaas-checkout --use-api --yes
          supabase functions deploy asaas-cancelar --use-api --yes
          supabase functions deploy comprar-pdf --use-api --yes
          supabase functions deploy baixar-pdf --use-api --yes
          supabase functions deploy asaas-assinar-agora --use-api --yes
          supabase functions deploy cortesia --use-api --yes
